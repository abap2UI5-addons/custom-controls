# abaplint against the abap2UI5 framework dependency, plus the gates that keep
# the generated artefacts honest.
#
# The abap2UI5-linter's headless view render is deliberately not run here: it
# validates views against the UI5 metadata snapshot, which does not know
# z2ui5_cci.cc.SignaturePad - a custom control is invisible to it by definition.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # the property gate: controls, members, bindings and the abap2ui5 semantics
  # of every app class. Settings in abap2ui5lint.jsonc - the render gate is off
  # there, for the reason in the header above.
  check-abap2ui5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the only job here that writes: its last step publishes the badges
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx abap2ui5lint

      # The gate above rewrote .github/badges/ (abap2ui5lint.jsonc "badge"),
      # and this step publishes those two files to the `badges` branch - an
      # orphan branch that holds nothing else and is what the README badges
      # read. They used to be committed by hand with each change, and a change
      # that left them out kept the README on a stale count. Only on main and
      # only after a green gate: a pull request run publishes nothing, the run
      # on main after the merge does. A failed push (a ruleset on the branch)
      # is a warning: the README then keeps showing the previous state rather
      # than a wrong one.
      - name: Publish the badges
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          ls .github/badges/*.json >/dev/null 2>&1 || { echo "::warning::The gate wrote no badge files - nothing to publish."; exit 0; }
          dir="$RUNNER_TEMP/badges"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch -q --depth=1 origin badges
            git worktree add -q "$dir" FETCH_HEAD
            git -C "$dir" checkout -q -B badges
          else
            git worktree add -q --detach "$dir"
            git -C "$dir" switch -q --orphan badges
          fi
          cp .github/badges/*.json "$dir/"
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then
            echo "The badges branch is up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -qm "Badges for ${GITHUB_SHA::7}"
          if git push -q origin badges; then
            echo "Badges published to the badges branch."
          else
            echo "::warning::The badges could not be pushed to the badges branch - the README keeps showing the previous state."
          fi

  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: abaplint (expect 0 issues)
        run: npm run lint

  app2bsp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # the generated BSP artefacts must match app/webapp - a stale page would
      # deploy old JavaScript without anyone noticing
      - name: app2bsp is up to date
        run: |
          npm run app2bsp
          git diff --exit-code -- src

  # app/webapp/cc/LibUrls.js is generated from tools/libs.json and the installed
  # package versions. Regenerating it here means a hand-edited URL, or a version
  # bumped in package.json without re-running the generator, fails the build
  # instead of shipping a CDN URL nothing was tested against.
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: LibUrls.js is up to date
        run: |
          npm run vendor
          git diff --exit-code -- app/webapp

      # The local build is what the `local` branch ships; building it here
      # proves every library still vendors and wraps within the BSP line limit
      # before publish-local tries it.
      - name: local build succeeds
        run: npm run build:local

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: syntax check the custom controls
        run: for f in app/webapp/cc/*.js; do node --check "$f"; done
      - name: unit tests
        run: npm test
      # The ImageMapster overlay is geometry, and geometry needs a layout
      # engine: this drives the control in headless Chromium and checks that a
      # click at a point in the picture lands on the region drawn there, before
      # and after a resize. ubuntu-latest ships a Chromium; the runner skips
      # itself when there is none rather than failing.
      - name: overlay browser check
        run: npm run check:browser
