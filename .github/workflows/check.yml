# abaplint against the abap2UI5 framework dependency, plus the gates that keep
# the generated artefacts honest.
#
# The abap2UI5-linter's headless view render is deliberately not run here: it
# validates views against the UI5 metadata snapshot, which does not know
# z2ui5_cci.cc.SignaturePad - a custom control is invisible to it by definition.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: abaplint (expect 0 issues)
        run: npm run lint

  app2bsp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # the generated BSP artefacts must match app/webapp - a stale page would
      # deploy old JavaScript without anyone noticing
      - name: app2bsp is up to date
        run: |
          npm run app2bsp
          git diff --exit-code -- src

  # app/webapp/cc/LibUrls.js is generated from tools/libs.json and the installed
  # package versions. Regenerating it here means a hand-edited URL, or a version
  # bumped in package.json without re-running the generator, fails the build
  # instead of shipping a CDN URL nothing was tested against.
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: LibUrls.js is up to date
        run: |
          npm run vendor
          git diff --exit-code -- app/webapp

      # The local build is what the `local` branch ships; building it here
      # proves every library still vendors and wraps within the BSP line limit
      # before publish-local tries it.
      - name: local build succeeds
        run: npm run build:local

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: syntax check the custom controls
        run: for f in app/webapp/cc/*.js; do node --check "$f"; done
      - name: unit tests
        run: npm test
      # The ImageMapster overlay is geometry, and geometry needs a layout
      # engine: this drives the control in headless Chromium and checks that a
      # click at a point in the picture lands on the region drawn there, before
      # and after a resize. ubuntu-latest ships a Chromium; the runner skips
      # itself when there is none rather than failing.
      - name: overlay browser check
        run: npm run check:browser
