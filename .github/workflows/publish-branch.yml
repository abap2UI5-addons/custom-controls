name: publish-branch

# Shared implementation for the derived branches. It checks `main` out, runs
# one transformation over it, validates the result with abaplint and
# force-pushes it to the given branch. The thin publish-<name> callers supply
# the trigger and the parameters.
#
# Derived branches are generated, never developed on: every push to `main`
# rebuilds them from scratch, so a commit made on one is lost on the next run.
#
#   702     `npm run downport` - the sources rewritten to 7.02 syntax
#   local   `npm run build:local` - the third-party libraries vendored into the
#           BSP, so no browser has to reach a CDN
#
# The two transformations are independent and compose: a branch carrying both
# is `prepare: npm run downport && npm run build:local` and nothing else.

on:
  workflow_call:
    inputs:
      branch:
        description: "Output branch: 702 | local"
        required: true
        type: string
      prepare:
        description: "Shell command that turns the checkout into the branch content"
        required: true
        type: string
      lint_config:
        description: "abaplint config used to validate the content before the push"
        required: false
        type: string
        default: "abaplint.jsonc"

permissions:
  contents: read

jobs:
  publish-branch:
    if: github.repository == 'abap2UI5-addons/custom-controls'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Prepare ${{ inputs.branch }} content
        run: ${{ inputs.prepare }}

      # The release-specific config is passed explicitly and is never copied
      # over the root abaplint.jsonc: the abaplint GitHub App picks the root
      # config up on the derived branch and resolves dependencies from the
      # installed repository's DEFAULT branch, ignoring the `branch` field -
      # which is a CLI feature. A v702 root config there would check the
      # downported controls against the un-downported abap2UI5@main and report
      # every type declared WITH EMPTY KEY as unknown.
      - name: Lint ${{ inputs.branch }} content
        run: npx abaplint ${{ inputs.lint_config }}

      # The generated BSP has to match app/webapp on the derived branch too -
      # a `local` branch whose pages still carry the CDN URLs would install
      # cleanly and then fail to render on a system without internet.
      #
      # Compared against a snapshot rather than against HEAD: the prepare step
      # has already rewritten the working tree (the downport edits every ABAP
      # source), so `git diff` would report its own output as drift.
      - name: BSP artefacts are in sync
        run: |
          rm -rf "${RUNNER_TEMP}/bsp-before"
          cp -r src/01 "${RUNNER_TEMP}/bsp-before"
          npm run app2bsp
          diff -r "${RUNNER_TEMP}/bsp-before" src/01

      - name: Commit and push to ${{ inputs.branch }}
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "generate ${BRANCH} from ${GITHUB_SHA}"
          git push --force origin "HEAD:${BRANCH}"
